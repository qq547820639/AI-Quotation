name: CI

# 安全强门禁（P1 Task 8）：
# - 所有 GitHub Actions 均以 commit SHA 锁定（附版本号注释），避免浮动 tag 被篡改；均运行于 node20 运行时。
# - security-scan 的 bandit / pip-audit / npm audit / trivy 失败即阻断 CI（无 continue-on-error、无 `|| true`）。
# - trivy 对 HIGH/CRITICAL 使用非零退出码（--exit-code 1 --severity HIGH,CRITICAL）。
# - 扫描报告与 SBOM(trivy CycloneDX) 在成功或失败时均上传为 artifact（if: always()）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + TypeCheck + Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (node20)
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0 (node20)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Frontend unit tests with coverage gate (>=30%)
        run: npx vitest run --coverage
      - run: npm run i18n:check
      - name: Upload frontend test logs on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3 (node20)
        with:
          name: frontend-test-logs
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  build:
    name: Production Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (node20)
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0 (node20)
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3 (node20)
        with:
          name: dist
          path: dist/

  backend-test:
    name: Backend Lint + Unit + API Integration + Permissions + State Transitions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (node20)
      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0 (node20)
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Backend import smoke test
        run: cd backend && python -c "from app.main import app; print('Backend import OK')"
      - name: Verify Alembic migration (SQLite)
        run: cd backend && DB_PATH=ci_migration.db python -m alembic upgrade head && rm -f ci_migration.db
      - name: Run backend tests (pytest, SQLite, coverage >=80%)
        run: cd backend && python -m pytest -v
      - name: Run PostgreSQL integration tests (real PG)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # 修复 pytest-cov 禁用冲突：pytest.ini 的 addopts 会注入 --cov=app，
        # 若仅用 -p no:cov 禁用插件，--cov 参数将变成无法识别的参数导致 pytest 报错退出。
        # -p no:cov 禁用插件，-o addopts= 清空 addopts 彻底移除 --cov 注入，二者结合才真正关闭覆盖率。
        run: cd backend && python -m pytest tests/test_postgres_integration.py -v -p no:cov -o addopts=
      - name: Upload backend test logs on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3 (node20)
        with:
          name: backend-test-logs
          path: backend/.pytest_cache/
          if-no-files-found: ignore

  security-scan:
    name: Security Scan (Secrets + SAST + Dependencies + Image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (node20)
      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0 (node20)
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0 (node20)
        with:
          node-version: 20
          cache: npm
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.6 (node20)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Python SAST (bandit)
        run: |
          cd backend && pip install bandit
          bandit -r app -f html -o bandit.html
          bandit -r app -f json -o bandit.json
      - name: Python dependency audit (pip-audit)
        run: |
          cd backend && pip install pip-audit
          pip-audit --format json > pip-audit.json
      - name: Node dependency audit (npm audit)
        run: npm audit --omit=dev --json > npm-audit.json
      - name: Image scan (Trivy)
        run: |
          docker build -t procurement-backend . -f backend/Dockerfile
          docker build -t procurement-frontend . -f Dockerfile.frontend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --exit-code 1 --no-progress --severity HIGH,CRITICAL --format json -o trivy-backend.json procurement-backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --exit-code 1 --no-progress --severity HIGH,CRITICAL --format json -o trivy-frontend.json procurement-frontend
      - name: Generate SBOM (CycloneDX via trivy, backend + frontend)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.57.1 fs --quiet --format cyclonedx --output sbom-backend.cdx.json backend
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.57.1 fs --quiet --format cyclonedx --output sbom-frontend.cdx.json .
          cd backend && pip freeze > ../sbom-backend-requirements.txt
          cp ../package-lock.json ../sbom-frontend-package-lock.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3 (node20)
        with:
          name: sbom
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
            sbom-backend-requirements.txt
            sbom-frontend-package-lock.json
          if-no-files-found: ignore
      - name: Upload scan reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3 (node20)
        with:
          name: security-scan-reports
          path: |
            backend/bandit.html
            backend/bandit.json
            pip-audit.json
            npm-audit.json
            trivy-backend.json
            trivy-frontend.json
          if-no-files-found: ignore

  docker-e2e:
    name: Docker Build + Compose + Real Frontend/Backend E2E
    needs: [quality, build, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (node20)
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0 (node20)
        with:
          node-version: 20
          cache: npm
      - name: Install Playwright browser binaries (chromium + firefox + webkit)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build & start all services (docker compose)
        run: docker compose up -d --build
      - name: Wait for backend health check (real DB probe)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then echo "Backend healthy (attempt $i)"; break; fi
            echo "Waiting for backend... (status=$code, attempt $i)"; sleep 5
          done
          curl -sf http://localhost:8080/api/health
      - name: Wait for frontend (nginx)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || true)
            if [ "$code" = "200" ]; then echo "Frontend ready (attempt $i)"; break; fi
            echo "Waiting for frontend... (status=$code, attempt $i)"; sleep 5
          done
          curl -sf http://localhost:80
      - name: Run Playwright E2E (real frontend/backend integration)
        timeout-minutes: 30
        run: npx playwright test --reporter=html,list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3 (node20)
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=300 || true
      - name: Cleanup environment
        if: always()
        run: docker compose down -v --remove-orphans