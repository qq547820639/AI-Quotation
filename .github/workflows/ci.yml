name: CI

# 安全强门禁（P1 Task 8）：
# - 所有 GitHub Actions 均以 commit SHA 锁定（附版本号注释），避免浮动 tag 被篡改；均运行于 node20 运行时。
# - security-scan 的 bandit / pip-audit / npm audit / trivy 失败即阻断 CI（无 continue-on-error、无 `|| true`）。
# - trivy 对 HIGH/CRITICAL 使用非零退出码（--exit-code 1 --severity HIGH,CRITICAL）。
# - 扫描报告与 SBOM(trivy CycloneDX) 在成功或失败时均上传为 artifact（if: always()）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 显式声明最小权限。原先整份文件没有一个 permissions 块 ⇒ 所有作业继承仓库/组织默认档，
# 而默认档很可能是"只读仓库内容"——那正好解释 build 作业的位置：`npm ci` 与 `npm run build`
# 都在诊断档镜像里证过 rc=0（PR #5 19:51:37 / 20:21:36 两条评论），失败落在其后唯一的
# upload-artifact 上（该动作要 `actions: write`）。同仓的 quality-diag.yml 声明了
# pull-requests: write 才贴得出评论，这本身就是"默认档不够用"的旁证。
permissions:
  contents: read # checkout
  actions: write # upload-artifact（dist / SBOM / 扫描报告 / playwright 产物）与其日志读取
  pull-requests: write # 失败时把现场贴回 PR 的那一步

jobs:
  quality:
    name: Lint + TypeCheck + Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Verify every tracked source is actually type-checked
        # 2026-09-27：ActionWorkbench.test.tsx 与 actionWorkbench.test.ts 去扩展名后大小写相等，
        # TS 在大小写不敏感卷的 include 展开会丢掉后者之一 ⇒ 那个组件测试文件从未被类型检查，
        # 而 tsc --noEmit 依旧 rc=0、vitest 也照常跑它。这条按"两边集合的差"来判，不看命名规律。
        run: |
          npm run tsc:cov:check
          node scripts/check-tsc-coverage.mjs --self-test
      - name: Frontend unit tests with coverage gate (>=30%)
        run: npx vitest run --coverage
      - run: npm run i18n:check
      - run: node scripts/check-i18n.mjs --self-test
      - name: Aggregate gate — every check-*.mjs must pass body AND --self-test
        # 今天缺的就是这一步：八把尺子各自有自测，但没人一次跑全，
        # 所以我能连着两次提交而漏掉 storage-receipt 的棘轮超限（quiet 74→79）。
        # 它不判断业务规则，只保证"没有哪把尺子被静默跳过"；清单靠枚举，不靠手写名单。
        run: npm run gates
      - name: Verify local-storage writes don't announce success without a receipt
        # R50：storage.ts 的 saveJSON/removeKey/clearAll 过去把 QuotaExceededError/SecurityError
        # 就地吞掉并返回 void ⇒ 调用方没有任何凭据，却能弹"已保存/已清空/已删除"。
        # 判据按函数粒度走 AST：丢弃回执 + 同函数后跟 notifySuccess + 无其他凭据（await / .success 读）⇒ 红。
        # 自测臂：注入 3 处必须开火、删掉成功提示必须降到 quiet（证明它不把"丢弃结果"本身当违规）。
        run: |
          npm run storage:check
          node scripts/check-storage-receipt.mjs --self-test
      - name: Verify settings fields are either read somewhere or declared inert
        # R56（R49 续）：设置页的字段有两根轴——值有没有上行到服务端、有没有任何生产代码读它。
        # 既不上行也没读者的开关，"设置已保存"是对用户宣称了一个不改变任何行为的动作。
        # 判据按类型解析（不用文本：同名的 Inquiry.currency 会污染分母），inert 必须逐条挂理由，
        # 且台账双向对账：谎报惰性 / 引用过期 / 单位被删 都判红。退码 2 = 量具故障，不与产品违规混。
        run: |
          npm run settings:inert:check
          node scripts/check-settings-inert.mjs --self-test
      - name: Verify past-tense notifications aren't minted inside an optimistic state recipe
        # R53：8 个写入口把「询价单 X 已取消」这类过去式通知铸在 set(状态配方) 体内，
        # 而 catch 只回滚实体、仓里没有删通知的 API ⇒ 被拒的动作留下永久旁证。
        # 自测三臂：夹具 2 处必须开火、合规侧 2 处不掉档、换成"4 次铸造全在配方之外"的逆语料必须 0 处。
        run: |
          npm run notify-mint:check
          node scripts/check-notification-optimistic-mint.mjs --self-test
      - name: Upload frontend test logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        continue-on-error: true # 账号级产物存储满档（GitHub Free 500 MB，全私有仓库共用）不该把质量/安全作业判红；判定由前面的扫描与断言步做，产物只供事后排查
        with:
          name: frontend-test-logs
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  build:
    name: Production Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 这里原本有一步 upload-artifact（name: dist）。2026-09-27 一手日志把它判死了：
      # `##[error]Failed to CreateArtifact: Artifact storage quota has been hit.`（PR #5 评论
      # 21:06:39，Production Build 步位 `failure #6 Run actions/upload-artifact`，
      # 而 #4 npm ci、#5 npm run build 都是 success）——账号级 500 MB 产物存储满档
      # （GitHub Free，含所有私有仓库），不是权限、不是磁盘、不是构建。
      # 删掉而不是加重试：这一步的消费者数量为零，是结构面读出来的
      # （按 YAML 枚举 steps[].uses 共 19 条，含 download 的 0 条），
      # 而 compose 侧的镜像构建自己跑 npm ci + npm run build（Dockerfile.frontend:4-12）。
      # 留着它只有代价（4.4 MB×每轮）没有收益，正是把配额吃满的那一类。
      - name: 失败时把现场贴回 PR（本作业的日志要鉴权才读得到）
        # 为什么要这一步：build 作业连续两次在同一处红（19:08:26→19:09:23、19:45:30→19:46:27，都是 57 s），
        # 而同一台 runner、同一棵树上诊断档镜像跑的 `npm run build` 是 rc=0（PR #5 19:51:37 那条评论），
        # 本机 Linux/Node24/lab 装树复算 `tsc -b --force` 与 `vite build` 也全 rc=0。
        # 剩下的唯一未取证步骤是 upload-artifact，但 Actions 日志要登录才读得到、MCP 也没有取日志的工具，
        # 所以让**这一步自己把话带回来**：清点 dist、看磁盘、把 build 原样重跑一遍并如实报退码。
        # 重跑若 rc=0，就把"失败不在 build、而在 build 之后那一步"这条推断变成读数；仍非零则带回结尾 40 行。
        # 只在 failure() 时跑，不参与判定；事件字段一律走 env，不拼进 shell（见 PostToolUse 那条提示）。
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
          JOB_NAME: ${{ github.job }}
        run: |
          set +e
          {
            echo "### build 作业失败现场（一手取证，只回话不改判）"
            echo "- job=$JOB_NAME run=$RUN_ID head_ref=${HEAD_REF:-（push 事件无此值）}"
            echo "- node=$(node -v 2>/dev/null) npm=$(npm -v 2>/dev/null)"
            echo "- dist：$([ -d dist ] && echo 存在 || echo 不存在)｜文件数 $(find dist -type f 2>/dev/null | wc -l)｜体积 $(du -sh dist 2>/dev/null | cut -f1)"
            echo "- 磁盘：$(df -h "$PWD" | tail -1)"
            echo "- 重跑 \`npm run build\` 的结尾 40 行："
            echo '```'
            npm run build > /tmp/buildagain.log 2>&1
            rcagain=$?
            tail -40 /tmp/buildagain.log
            echo "重跑 rc=$rcagain"
            echo '```'
            echo "- 判读：重跑 rc=0 ⇒ 失败不在 npm ci/build，落在它之后那一步；rc≠0 ⇒ 结尾 40 行就是原因。"
            echo "- 本 job 自己的日志结尾 45 行（upload-artifact 之类的动作报错只会出现在这里）："
            echo '```'
            # 本 job 的 id 不能拿 github.job（那是键名 "build"）去配显示名——同一 run 里
            # "Docker Build + Compose…" 也含 "build"，会配错。改用一个自指事实：
            # 报告步跑在本 job 内部的那一刻，整个 run 里唯一 in_progress 且无 conclusion 的就是本 job。
            JID=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.status=="in_progress" and .conclusion==null) | .id' 2>/dev/null | head -1)
            echo "job_id=$JID（按 in_progress 自指挑出，不按名字匹配）"
            if [ -n "$JID" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$JID/logs" 2>&1 | tail -45
            else
              echo "取不到本 job 的 id（多半是令牌没有 actions: read）——那本身就是结论的一半"
            fi
            echo '```'
          } > /tmp/buildfail.md
          PR=""
          if [ -n "$HEAD_REF" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json number --jq '.[0].number' 2>/dev/null)
          fi
          case "$PR" in
            ''|*[!0-9]*) echo "PR 编号取不到（=$PR），把现场打进日志"; cat /tmp/buildfail.md ;;
            *) gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/buildfail.md || cat /tmp/buildfail.md ;;
          esac
          exit 0

  failed-logs:
    name: 把每个红作业的日志结尾贴回 PR（只回话，不改判）
    # 为什么把"只取 Production Build"那一版换成按 conclusion 枚举：一轮 CI 要 20+ 分钟，而场上
    # 同时挂着两个未定因的红（Production Build 与 Security Scan）。枚举失败作业后，一轮就能把
    # 两红的日志文字一起带回来；并且先打 `steps[]` 的逐步 conclusion，把"红在哪一步"变成读数，
    # 不再靠"把取证步挪到 upload 之后"那种位置推断（R80 用的就是位置推断）。
    # 为什么取日志必须放在作业外部：作业未结束时它的日志不可下载
    # （一手读数：PR #5 20:37:27 评论末段 `BlobNotFound` / `gh: HTTP 404`）。
    needs: [quality, build, backend-test, security-scan, docker-e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # 下载本 run 的 job 日志
      pull-requests: write   # 贴回 PR
    steps:
      - name: 枚举失败作业并逐个取步位与日志结尾
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          OUT=/tmp/failedlogs.md
          {
            echo "### 红作业日志（一手，只回话不改判）"
            echo "- run=$RUN_ID head_ref=${HEAD_REF:-（push 事件无此值）}"
            JOBS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' 2>&1)
            if ! printf '%s' "$JOBS" | grep -qE '^[0-9]+'; then
              echo "没有枚举到 conclusion==failure 的作业（或取作业清单本身就失败）。原始返回："
              printf '%s\n' "$JOBS"
            fi
            while IFS=$'\t' read -r JID JNAME; do
              case "$JID" in ''|*[!0-9]*) continue ;; esac
              echo
              echo "#### $JNAME（job_id=$JID）"
              echo '- 步位（`steps[]` 的 conclusion，failure 那一行就是出事的步）：'
              gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$JID" \
                --jq '.steps[] | "  - \(.conclusion) #\(.number) \(.name)"' 2>&1
              echo '- 日志结尾（已剥 ANSI，兜底：时间窗没切出东西时看这里）：'
              L=/tmp/job-$JID.log
              L2=/tmp/job-$JID.clean.log
              gh api --allow-escape-sequences "/repos/$GITHUB_REPOSITORY/actions/jobs/$JID/logs" > "$L" 2>&1
              sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' "$L" > "$L2"
              # 失败步的**原文块**：步名与日志组头对不上（run 步的组头是 `##[group]Run <脚本首行>`，
              # 不带自定义 name），所以不靠名字匹配，靠 `steps[]` 的 started_at/completed_at 切时间窗。
              # 上一轮就是靠尾巴 70 行才漏掉 gitleaks 那一步说了什么（步位判到了 #5，文字没带回来）。
              W=$(gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$JID" \
                --jq '.steps[] | select(.conclusion == "failure") | "\(.started_at // "")\u001f\(.completed_at // "")\u001f\(.name)"' 2>/dev/null)
              while IFS=$'\037' read -r W0 W1 WNAME; do
                case "$W0" in '') [ -z "$WNAME" ] || echo "（失败步 ${WNAME} 没有 started_at，切不出时间窗）"; continue ;; esac
                echo "- 失败步原文（${WNAME}｜时间窗 ${W0} → ${W1:-无上限}）："
                # 取窗口的**结尾**而不是开头：一手教训是 pip-audit 那一步（PR #5 评论 21:38:52），
                # 前 120 行全被 `pip install` 的下载噪声占满，真正的判决行
                # `Found 10 known vulnerabilities in 1 package` 恰好落在窗口末尾，
                # 按开头截就把"这一红说了什么"截成了"这一红在装包"。
                WL=/tmp/window-$JID-$W0.log
                awk -v a="$W0" -v b="${W1:-9999}" 'BEGIN{sa=substr(a,1,19); sb=substr(b,1,19)}
                  { t=substr($0,1,19); if (length(t)>=19 && t>=sa && t<=sb) print }' "$L2" > "$WL"
                echo '```'
                echo "（窗口共 $(wc -l < "$WL") 行，下面取它的结尾 60 行）"
                tail -60 "$WL"
                echo '```'
              done <<EOW
          $W
          EOW
              echo '- 日志结尾（已剥 ANSI；时间窗切不出来时看这里）：'
              echo '```'
              echo "（日志共 $(wc -l < "$L2") 行，原始 $(wc -c < "$L") 字节）"
              echo '-- 全部 ##[error] 行（最多 15 条）--'
              grep -n '##\[error\]' "$L2" | head -15
              echo '-- 结尾 70 行 --'
              tail -70 "$L2"
              echo '```'
            done <<EOFJ
          $JOBS
          EOFJ
          } > "$OUT"
          BYTES=$(wc -c < "$OUT")
          echo "评论体积 $BYTES 字节"
          if [ "$BYTES" -gt 60000 ]; then
            { head -c 59000 "$OUT"; echo; echo "（超长截断：余下 $((BYTES - 59000)) 字节未贴）"; } > /tmp/t.md
            mv /tmp/t.md "$OUT"
          fi
          cat "$OUT"
          PR=""
          if [ -n "$HEAD_REF" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json number --jq '.[0].number' 2>/dev/null)
          fi
          case "$PR" in
            ''|*[!0-9]*) echo "PR 编号取不到（=$PR），日志已打进本作业输出" ;;
            *) gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$OUT" || echo "贴评论失败，日志已打进本作业输出" ;;
          esac
          exit 0

  backend-test:
    name: Backend Lint + Unit + API Integration + Permissions + State Transitions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0 (node24)
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Backend import smoke test
        run: cd backend && python -c "from app.main import app; print('Backend import OK')"
      - name: Verify Alembic migration (SQLite)
        run: cd backend && DB_PATH=ci_migration.db python -m alembic upgrade head && rm -f ci_migration.db
      - name: Run backend tests (pytest, SQLite, coverage >=80%)
        run: cd backend && python -m pytest -v
      - name: Run PostgreSQL integration tests (real PG)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # 修复 pytest-cov 禁用冲突：pytest.ini 的 addopts 会注入 --cov=app，
        # 若仅用 -p no:cov 禁用插件，--cov 参数将变成无法识别的参数导致 pytest 报错退出。
        # -p no:cov 禁用插件，-o addopts= 清空 addopts 彻底移除 --cov 注入，二者结合才真正关闭覆盖率。
        run: cd backend && python -m pytest tests/test_postgres_integration.py -v -p no:cov -o addopts=
      - name: Upload backend test logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        continue-on-error: true # 账号级产物存储满档（GitHub Free 500 MB，全私有仓库共用）不该把质量/安全作业判红；判定由前面的扫描与断言步做，产物只供事后排查
        with:
          name: backend-test-logs
          path: backend/.pytest_cache/
          if-no-files-found: ignore

  security-scan:
    name: Security Scan (Secrets + SAST + Dependencies + Image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
        with:
          # gitleaks 需要全量历史计算 PR/push 的 diff 范围（base^..head）；
          # 默认浅克隆（depth=1）会导致 base 提交不可用，gitleaks 报
          # "unknown revision / failed to scan Git repository" 而退出码 1。
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0 (node24)
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (node24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 关掉动作内部的 sarif 产物上传。一手日志（PR #5 评论 21:16:11 的失败步原文块）：
          # gitleaks 自己扫得干干净净（`30 commits scanned.` / `no leaks found`），紧接着死在
          # 它替我上传 sarif 的那一下：`Failed to CreateArtifact: Artifact storage quota has been hit.`
          # 账号级 500 MB 满档不是这条门禁该判红的事，也不该由我修；扫描本身的判定
          # （`--exit-code=2`，命中泄漏即红）一个字没动。
          # 开关判据一手重开：src/index.js:24 读 GITLEAKS_ENABLE_UPLOAD_ARTIFACT=="false"，README:80 同名。
          # 代价：sarif 不再作为 artifact 留档（命中时仍写进作业 summary）。
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Python SAST (bandit)
        run: |
          cd backend && pip install bandit
          bandit -r app -f html -o bandit.html
          bandit -r app -f json -o bandit.json
      - name: Python dependency audit (pip-audit, scoped to declared runtime deps)
        run: |
          cd backend && pip install pip-audit
          # 仅审计 requirements.txt 声明的运行时依赖，而非整个 Python 环境。
          # 环境中的 pip 自身可能存在开发期 CVE（与生产运行时无关），纳入会使安全门禁误报失败。
          pip-audit -r requirements.txt --format json > pip-audit.json
      - name: Node dependency audit (npm audit, minimal-scope exception)
        run: node scripts/audit-exceptions.mjs
      - name: Image scan (Trivy)
        run: |
          # 后端 Dockerfile 从上下文根复制 requirements.txt，构建上下文必须是 backend/（与
          # docker-compose 的 build: ./backend 一致）；此前用仓库根 "." 作上下文导致
          # COPY requirements.txt 找不到文件、构建失败（非真实漏洞）。
          docker build -t procurement-backend -f backend/Dockerfile backend
          docker build -t procurement-frontend . -f Dockerfile.frontend
          # 通过 -v "$PWD:/report" 把当前目录挂载进容器，使 trivy 的 -o 报表写到宿主机
          # （否则 -o 只写进刚退出的容器内，宿主拿不到报表，失败时无法排查）。
          # 这里改成 --exit-code 0：命中与否由下面的摘要脚本判，一次扫描同时拿到报表与判决，
          # 不再有"表格印在中段、结尾只剩 upload 噪声"的空读数（run=36380814151 的 #9 就是那样）。
          for IMG in procurement-backend procurement-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/report" -w /report \
              aquasec/trivy:0.57.1 image --exit-code 0 --no-progress --severity HIGH,CRITICAL \
              --format json -o "trivy-${IMG#procurement-}.json" "$IMG"
          done
          # 自测跑在摘要之前：先证明这把尺子会开火，再信它报的"零命中"。
          node scripts/ci-summarize-trivy.mjs --self-test
          # 最后一行才是门禁：命中 HIGH/CRITICAL ⇒ 脚本自身 exit 1，强度与原 --exit-code 1 相同，
          # 但退码旁边同时印着 CVE 编号、包名、当前版本与修复版本。
          node scripts/ci-summarize-trivy.mjs trivy-backend.json trivy-frontend.json
      - name: Generate SBOM (CycloneDX via trivy, backend + frontend)
        # if: always()——这一步是 fs 扫描，与镜像门禁的命中与否无关。原先默认 success() 时，
        # 只要 Trivy 判红它就被 skip，两轮下来一次也没跑过（R88/R91 的 #10 全是 skipped）。
        if: always()
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.57.1 fs --quiet --format cyclonedx --output sbom-backend.cdx.json backend
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.57.1 fs --quiet --format cyclonedx --output sbom-frontend.cdx.json .
          cd backend && pip freeze > ../sbom-backend-requirements.txt
          cp ../package-lock.json ../sbom-frontend-package-lock.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        continue-on-error: true # 账号级产物存储满档（GitHub Free 500 MB，全私有仓库共用）不该把质量/安全作业判红；判定由前面的扫描与断言步做，产物只供事后排查
        with:
          name: sbom
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
            sbom-backend-requirements.txt
            sbom-frontend-package-lock.json
          if-no-files-found: ignore
      - name: Upload scan reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        continue-on-error: true # 账号级产物存储满档（GitHub Free 500 MB，全私有仓库共用）不该把质量/安全作业判红；判定由前面的扫描与断言步做，产物只供事后排查
        with:
          name: security-scan-reports
          path: |
            backend/bandit.html
            backend/bandit.json
            pip-audit.json
            npm-audit.json
            trivy-backend.json
            trivy-frontend.json
          if-no-files-found: ignore

  docker-e2e:
    name: Docker Build + Compose + Real Frontend/Backend E2E
    # 为什么把 build 从 needs 里摘掉：这四轮里 build 一红（红在 upload-artifact 那一步），
    # docker-e2e 就被 GitHub 判成 skipped，于是"专用 runner 上的零重试 E2E 读数"这条真正要取的东西
    # 一次也没跑过。摘掉的依据是"没有一步消费 build 作业的产物"，而这只能用结构面判：
    # 按 YAML 解析后枚举 `steps[].uses`（19 条，含 download 的 0 条，其中 upload-artifact 6 条分布在
    # quality/build/backend-test/security-scan/docker-e2e）。文本 grep 在这里一律不可用——
    # 我先后用过 `grep download-artifact` 与 `grep 'uses:.*download'` 两种写法当证据，
    # 两次命中的都只有这条注释自己（词面被自己的说明污染，读数 1 却与"真有一步"完全同形）。
    # 另一条独立依据：Dockerfile.frontend:4-12 是 node:24-alpine 里 `npm ci` + `npm run build`
    # 再 `COPY --from=builder /app/dist`，即 compose `up -d --build` 自己把前端建出来。
    # 保留 quality 与 backend-test 两个 need：它们才是 E2E 的前置事实（单测与后端契约）。
    needs: [quality, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies (incl. @playwright/test)
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser binaries (chromium + firefox + webkit)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cache ClamAV signature database
        # 避免每次运行全量下载 ClamAV 病毒库（实测冷启动约 20 分钟）。
        # 缓存命中后 clamav 容器启动即用已有库，freshclam 仅做增量检查，就绪时间缩至秒级。
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (node24)
        with:
          path: .clamav-cache
          key: clamav-db-${{ runner.os }}
          restore-keys: |
            clamav-db-${{ runner.os }}
      - name: Verify E2E config contract (demo password consistency)
        # 本 job 给 compose 与 playwright 两步各写了一次 DEMO_USER_PASSWORD 格式串；
        # dev 形态则靠 compose 默认值与 e2e/helpers.ts 兜底值对齐。任一漂移会让整套 E2E
        # 先 401×5 再全线 429，读起来像限流故障。这里在启动 compose 之前先判红，
        # 并跑尺子自带的两条反证（注入漂移 / 删除位点必须翻红）。
        run: |
          npm run e2e:config:check
          node scripts/check-e2e-demo-password.mjs --self-test
      - name: Verify installed tree matches the lockfile (drift pre-flight)
        # 2026-09-27 事故：一次 `npm install --no-save` 在跑测中的同一棵树上把 79 个包按 `^` 区间
        # 就地升级（含 @playwright/test 1.62.1→1.63.0），runner 被中途换掉，最后起跑的那个 project
        # 39 条全灭于 "Executable doesn't exist"，先跑完的 4 个 project 照旧绿 —— 读起来像产品回归。
        # git status 看不见这个面（node_modules 未跟踪），所以要一把独立的尺子。
        # 本机另有 Playwright 的 globalSetup 兜住 `npx playwright test` 这条路；CI 这条是显式第二步，
        # 保证即使有人绕过 config 也拦得住。跑尺子自身的 7 条反证（含"必须不开火"的平台可选包臂）。
        run: |
          npm run e2e:install:check
          node scripts/check-e2e-install.mjs --self-test
      - name: Verify E2E write-proof criterion (toast assertions)
        # R34：不指名的成功提示断言会被上一条还在屏上的 toast 冒充，于是用例在写请求
        # 飞行中就 goto、把请求掐断，表现为偶发红。这里钉住「证明写落地的提示必须指名文案」。
        # 判据已按 AST 版实现（认得模板字符串选择器、变量间接、getByText 的实参歧义；
        # 缺席断言与按钮名单列一档不误伤）。自测条数由脚本自己打印，不在这里抄数字。
        run: |
          npm run e2e:toast:check
          node scripts/check-e2e-toast-assertions.mjs --self-test
      - name: 自建 MinIO 镜像（GitHub release 资产＋sha256 校验）并交给 compose
        # 为什么自建（三条一手读数，全在 PR #5）：
        #  - 21:50:22 探活 v2：同一台 runner 上 `alpine:3.20` 与 `postgres:16` 都 rc=0，
        #    而 `minio/minio:latest` 与固定 tag `minio/minio:RELEASE.2025-04-22T22-12-26Z`
        #    全回 `pull access denied … repository does not exist or may require 'docker login'`
        #    ⇒ 不是匿名限流（对照能拉），是整个仓库在 Docker Hub 上不再公开；
        #    ghcr.io/minio/minio 回 denied、quay.io/minio/minio 回 unauthorized，
        #    而 `quay.io/api/v1/repository?namespace=minio&public=true` 列出的 69 个仓库里没有 minio/mc。
        #  - 官方二进制站也下了：`dl.min.io/server/minio/release/linux-amd64/minio` 与
        #    `dl.min.io/client/mc/release/linux-amd64/mc` 都返回 HTTP 410 Gone（本机 curl -I）。
        #  - GitHub release 仍公开且有 `.sha256sum`：minio server RELEASE.2025-09-07T16-13-09Z
        #    （更新的 RELEASE.2025-10-15T17-29-55Z 的 assets 数是 0，所以不取最新）与
        #    mc RELEASE.2025-08-13T08-35-41Z；两者的 sha256 已在 .ci/Dockerfile.minio 里钉死并在构建内校验。
        # 语义选择：不换成别的 S3 实现、也不关掉 S3——这条 E2E 场地要证的正是生产形态，
        # 而 compose 的两处调用（健康检查 `mc ready local`、`mc alias set` + `mc mb`）
        # 在这个自建镜像上逐字跑通过（本机一手：容器内 `mc ready local` 回
        # "The cluster 'local' is ready"；`mc mb` 建桶成功；对象写→读→删往返 OK）。
        # 失败时不覆盖变量：compose 仍按 `${MINIO_IMAGE:-minio/minio:latest}` 的默认值跑，
        # 于是红和上一轮同形可读，不会把前提悄悄换掉。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set +e
          docker build -f .ci/Dockerfile.minio -t qqi-minio:ci .ci > /tmp/mbuild.log 2>&1
          rc=$?
          {
            echo '### 自建 MinIO 镜像（runner 侧一手）'
            echo "- docker build rc=$rc"
            echo '- 构建输出结尾 20 行（含镜像内的 `minio --version` / `mc --version` 与 sha256sum -c 的结果）：'
            echo '```'
            tail -20 /tmp/mbuild.log
            echo '```'
          } > /tmp/minio.md
          if [ "$rc" = "0" ]; then
            echo "MINIO_IMAGE=qqi-minio:ci" >> "$GITHUB_ENV"
            echo "MC_IMAGE=qqi-minio:ci" >> "$GITHUB_ENV"
            echo "- 已导出 MINIO_IMAGE/MC_IMAGE=qqi-minio:ci" >> /tmp/minio.md
          else
            echo "- 构建失败：不覆盖变量，compose 用默认值（红会与上一轮同形）" >> /tmp/minio.md
          fi
          cat /tmp/minio.md
          PR=""
          if [ -n "$HEAD_REF" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json number --jq '.[0].number' 2>/dev/null)
          fi
          case "$PR" in
            ''|*[!0-9]*) echo 'PR 编号取不到（读数已打进本作业输出）' ;;
            *) gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/minio.md || echo '贴评论失败，读数已打进本作业输出' ;;
          esac
          exit 0
      - name: Build & start all services (docker compose)
        # 生产配置在 APP_ENV=prod 下为 fail-fast：compose 的 dev 默认值（SECRET_KEY/
        # DEMO_USER_PASSWORD/CORS/NOTIFY_CHANNEL）会被后端启动守卫拒绝。CI E2E 必须注入
        # 满足生产校验的真实值：强随机 SECRET_KEY、强 DEMO_USER_PASSWORD、非本地 CORS
        # 白名单、email 通知（SMTP 指向 mailpit 测试服务）。ClamAV 走真实扫描。
        env:
          SECRET_KEY: ${{ format('ci-e2e-{0}{1}{2}{3}', github.run_id, github.run_attempt, github.sha, 'strongsecretkey0123456789') }}
          DEMO_USER_PASSWORD: ${{ format('ci-e2e-{0}-strong-password', github.run_id) }}
          CORS_ORIGINS: https://ci-e2e.invalid,http://localhost:80
          NOTIFY_CHANNEL: email
          SMTP_HOST: mailpit
          SMTP_PORT: 1025
          SMTP_FROM: ci@ai-quotation.local
          # 生产形态 E2E 需要种子账号，但 APP_DEMO_MODE 会开启"快捷登录"且被生产配置校验
          # 拒绝。SEED_DEMO_DATA 与快捷登录解耦：只注入用 DEMO_USER_PASSWORD 哈希的种子
          # 用户（真实密码校验），在 APP_ENV=prod 下仍满足全部生产守卫（ClamAV/S3/Redis/
          # 强密码/非本地 CORS），使 E2E 能以内置账号真实登录。
          SEED_DEMO_DATA: true
        run: docker compose up -d --build
      - name: Wait for backend readiness (/api/ready validates DB+Redis+S3+ClamAV+Worker)
        run: |
          ok=0
          # ClamAV 首次启动需下载病毒库，冷启动实测约 20 分钟（命中 .clamav-cache 后秒级）；
          # 放宽就绪等待（最多 360*5s=1800s），并打印 /api/ready 响应体便于定位组件。
          for i in $(seq 1 360); do
            code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8080/api/ready || true)
            if [ "$code" = "200" ]; then ok=1; echo "Backend ready (attempt $i)"; break; fi
            echo "Waiting for /api/ready... (status=$code, attempt $i) body=$(cat /tmp/ready.json 2>/dev/null)"; sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Backend never became ready; last body: $(cat /tmp/ready.json 2>/dev/null)"
            docker compose ps
            docker compose logs --tail=200 backend
            # 诊断 ClamAV：确认 clamd 是否在 TCP 3310 监听、unix socket 是否存在，
            # 以及后端容器能否真实连上 clamav:3310（区分"连接失败"与"EICAR 未命中"两类根因）。
            echo "=== DIAG: clamad config ==="
            docker exec "$(docker compose ps -q clamav)" sh -c 'grep -E "TCPSocket|TCPAddr|LocalSocket" /etc/clamav/clamd.conf' 2>&1 || true
            echo "=== DIAG: clamd sockets ==="
            docker exec "$(docker compose ps -q clamav)" sh -c 'ls -la /tmp/clamd.sock /run/clamav/ 2>/dev/null; ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null' 2>&1 || true
            echo "=== DIAG: backend -> clamav:3310 TCP ==="
            docker exec "$(docker compose ps -q backend)" python -c "import socket; s=socket.create_connection(('clamav',3310),timeout=5); print('TCP_CONNECT_OK'); s.close()" 2>&1 || echo "TCP_CONNECT_FAIL"
            exit 1
          fi
          curl -sf http://localhost:8080/api/ready
      - name: Wait for frontend (nginx)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || true)
            if [ "$code" = "200" ]; then echo "Frontend ready (attempt $i)"; break; fi
            echo "Waiting for frontend... (status=$code, attempt $i)"; sleep 5
          done
          curl -sf http://localhost:80
      - name: Run Playwright E2E (real frontend/backend integration)
        # 30 → 45 分钟：run=36382719015（`2d2d782`）一手被 `##[error]The action 'Run Playwright E2E
        # …' has timed out after 30 minutes.` 掐死在测试 #179（分母 230），mobile-ios 整档没跑、
        # `.last-run.json` 没落盘 ⇒ 那一轮的"21 格红"其实是**同一条 30 分钟线**切出来的半个读数。
        # 依据：225 格时实测 28.7/29.0 分钟（R88/R91），2d2d782 加 5 格并把工件保留策略改成
        # retain-on-failure 之后，30 分钟已经不够；留 45 分钟给 230 格的串行档（workers=1）。
        timeout-minutes: 45
        env:
          # E2E 登录必须与后端种子用户密码一致（compose 已注入强 DEMO_USER_PASSWORD）。
          DEMO_USER_PASSWORD: ${{ format('ci-e2e-{0}-strong-password', github.run_id) }}
          # 抖动归因：默认档仍是 config 里的 1 次重试（main 上的读数与历史可比）。
          # 只有从 qoder/ci-evidence-0928 这条取证分支开出来的 PR 才关成 0——那条分支上
          # "渲染竞速断言"推广了 26 个站点，需要一次"首跑即绿"的读数才能归因；
          # 判 head_ref 而不是 ref_name，因为 pull_request 事件下 ref_name 是 refs/pull/N/merge。
          # 即便这条误合进 main，条件不命中也只是回到 1，不会把主线门禁改松或改严。
          PLAYWRIGHT_RETRIES: ${{ github.head_ref == 'qoder/ci-evidence-0928' && '0' || '1' }}
          # 第三张报表面：list 的失败详情印在 4400 行日志中段（取证载体取的是结尾 60 行，
          # 于是两轮读数只剩计数、没有一句错误文本）。JSON 由下一步逐条归因。
          # 该变量的相对路径基准由 Playwright 内部决定，所以下一步同时找仓库根与 test-results/ 两种落点。
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-json-results.json
        run: |
          set +e
          # 场地取样器：每 5 秒打一行（时刻、后端 /api/ready 的状态码与耗时、前端 / 的状态码与耗时、
          # 可用内存）。动机是 R92 的读数形状——`2d2d782` 那轮 21 格红全在 06:09 之后、之前 138 格全绿，
          # 这读起来像"场地跑到后半段劣化"，但失败面那一步是在 E2E **结束之后**才看场地的，
          # 那一刻健康不说明跑的时候健康。要判"整体事件 vs 逐格缺陷"，协变量必须按时刻采，
          # 而不是事后取一个断面。
          SAM=/tmp/venue-samples.tsv
          : > "$SAM"
          ( while :; do
              B=$(curl -s -o /dev/null -m 3 -w '%{http_code} %{time_total}' http://localhost:8080/api/ready 2>/dev/null || echo 'ERR -')
              F=$(curl -s -o /dev/null -m 3 -w '%{http_code} %{time_total}' http://localhost:80 2>/dev/null || echo 'ERR -')
              M=$(awk '/MemAvailable/{print $2}' /proc/meminfo 2>/dev/null || echo NA)
              L=$(cut -d' ' -f1 /proc/loadavg 2>/dev/null || echo NA)
              printf '%s\t%s\t%s\t%s\t%s\n' "$(date -u +%FT%TZ)" "$B" "$F" "$M" "$L" >> "$SAM"
              sleep 5
            done ) &
          SAMPLER=$!
          npx playwright test --reporter=html,list,json
          RC=$?
          kill "$SAMPLER" 2>/dev/null
          echo "playwright rc=$RC（采样器不参与判定，本步骤按同一退码结束）"
          exit $RC
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        continue-on-error: true # 账号级产物存储满档（GitHub Free 500 MB，全私有仓库共用）不该把质量/安全作业判红；判定由前面的扫描与断言步做，产物只供事后排查
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          # 默认 90 天是这次配额满档的主要来源（一份带 trace 的报告几十 MB，取证轮一晚跑十几遍）。
          # 报告只用于当场归因，7 天足够回看；账号存储 500 MB 是所有私有仓库共用的。
          retention-days: 7
      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=300 || true
      - name: 把 E2E 失败用例名贴回 PR（零重试档的归因读数）
        # 为什么不等 failed-logs 载体：载体的日志结尾只有 70 行，playwright 的逐条失败名
        # 在长日志里会被切掉；而 test-results/ 的目录名本身就编码了 project+用例标题，
        # .last-run.json 又直接给出失败用例的机器名。这一步只在 failure() 时跑，绿跑零影响。
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set +e
          OUT=/tmp/e2efail.md
          # JSON 报表的落点由 Playwright 决定（基准目录有两个候选），先把它找出来。
          J=""
          for C in e2e-json-results.json test-results/e2e-json-results.json; do
            if [ -f "$C" ]; then J="$C"; break; fi
          done
          {
            echo '### docker-e2e 失败面（一手，零重试档）'
            echo "- head_ref=${HEAD_REF:-（push 事件无此值）}（取证分支即 retries=0，判据与上面 Run Playwright E2E 那一步的 env 同一条）  用例结果条目：$(ls test-results 2>/dev/null | wc -l) 个"
            echo '- 逐条归因（`node scripts/ci-summarize-e2e.mjs`，脚本 rc 一并报出：0=无红、1=有红、2=报表读不到）：'
            echo '```'
            if [ -n "$J" ]; then
              node scripts/ci-summarize-e2e.mjs --self-test >/dev/null 2>&1
              echo "（本件自测 rc=$?，不为 0 说明摘要尺子自己坏了——条数由脚本自报，下面的读数不可信）"
              node scripts/ci-summarize-e2e.mjs "$J" 2>&1
              echo "（summarize rc=$?  报表=$J）"
            else
              echo '（没有找到 JSON 报表：E2E 步骤可能在该步的 timeout-minutes 到点时被掐断，'
              echo '  这一轮的逐条错误文本只剩日志窗口，归因读数缺位——不要把它读成"没有失败"）'
            fi
            echo '```'
            echo '- .last-run.json：'
            echo '```'
            cat test-results/.last-run.json 2>/dev/null || echo '（没有 .last-run.json：多半 E2E 步骤没跑到）'
            echo
            echo '```'
            echo '- 失败用例目录名（含 project 与标题）：'
            echo '```'
            find test-results -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed 's|test-results/||' | sort | head -40
            echo '```'
            echo '- 失败目录里的工件（2d2d782 起零重试档是 retain-on-failure，这里才有 trace/video 文件名可核）：'
            echo '```'
            find test-results -mindepth 2 -maxdepth 2 -type f 2>/dev/null | sed 's|test-results/||' | sort | head -40
            echo '```'
            # 场地现场：这一步跑在 Cleanup environment 之前，compose 还活着，所以能直接问它。
            # 动机是 2d2d782 那轮的形状——红全集中在 06:09 之后的那个 project 里、之前 0 红，
            # 那读起来像"场地在跑到后半段时劣化"，而不是 21 个各自独立的用例缺陷。
            echo '- 场地现场（健康端点与容器状态，不贴日志正文以免把环境值带进 PR）：'
            echo '```'
            echo "api/ready http=$(curl -s -o /tmp/rd.json -w '%{http_code}' http://localhost:8080/api/ready || echo 取不到)"
            echo "api/ready body=$(head -c 400 /tmp/rd.json 2>/dev/null)"
            docker compose ps --format '{{.Name}} {{.Status}}' 2>/dev/null | head -14
            docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' 2>/dev/null | head -14
            echo "宿主负载：$(cat /proc/loadavg 2>/dev/null || echo 取不到)"
            echo "内存：$(grep -E 'MemAvailable|MemTotal' /proc/meminfo 2>/dev/null | tr '\n' ' ')"
            echo "backend 日志里的 ERROR/Traceback 行数：$(docker compose logs --tail=400 backend 2>/dev/null | grep -Ec 'ERROR|Traceback')"
            # 采样序列（每 5 s 一行，跑在 E2E 的整个时间轴上）：把"红从哪个时刻开始"与
            # "后端什么时候变慢/变红"对齐，这是 R92 那两个候选档唯一的分辨读数。
            echo '-- 场地采样序列（时刻 / 后端 状态码 耗时s / 前端 状态码 耗时s / 可用内存kB / load1）--'
            if [ -s /tmp/venue-samples.tsv ]; then
              N=$(wc -l < /tmp/venue-samples.tsv)
              BAD=$(awk -F '\t' '{split($2,a," "); split($3,b," "); if (a[1]!="200" || b[1]!="200" || a[2]+0>2 || b[2]+0>2) c++} END{print c+0}' /tmp/venue-samples.tsv)
              FIRST=$(awk -F '\t' '{split($2,a," "); split($3,b," "); if (a[1]!="200" || b[1]!="200" || a[2]+0>2 || b[2]+0>2) {print $1" 后端="a[1]"/"a[2]"s 前端="b[1]"/"b[2]"s"; exit}}' /tmp/venue-samples.tsv)
              SLOW=$(awk -F '\t' '{split($2,a," "); if (a[2]+0>m) {m=a[2]+0; t=$1}} END{if (m>0) printf "%s 后端最慢 %.2fs", t, m}' /tmp/venue-samples.tsv)
              echo "样本 ${N} 个｜劣化(非 200 或 >2s) ${BAD} 个｜首个劣化：${FIRST:-无}｜${SLOW:-无}"
              echo "（每 12 个样本取 1 行 ≈ 每分钟一行，最多 45 行）"
              awk 'NR % 12 == 1' /tmp/venue-samples.tsv | head -45 | tr '\t' ' '
            else
              echo '（采样器没写出任何行：多半是 E2E 步骤在采样器起来前就失败，或 curl 不在 PATH）'
            fi
            echo '```'
          } > "$OUT"
          cat "$OUT"
          PR=""
          if [ -n "$HEAD_REF" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json number --jq '.[0].number' 2>/dev/null)
          fi
          case "$PR" in
            ''|*[!0-9]*) echo 'PR 编号取不到（见上输出）' ;;
            *) gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$OUT" || echo '贴评论失败，读数已打进本作业输出' ;;
          esac
          exit 0
      - name: Cleanup environment
        if: always()
        run: docker compose down -v --remove-orphans
