name: CI

# 安全强门禁（P1 Task 8）：
# - 所有 GitHub Actions 均以 commit SHA 锁定（附版本号注释），避免浮动 tag 被篡改；均运行于 node20 运行时。
# - security-scan 的 bandit / pip-audit / npm audit / trivy 失败即阻断 CI（无 continue-on-error、无 `|| true`）。
# - trivy 对 HIGH/CRITICAL 使用非零退出码（--exit-code 1 --severity HIGH,CRITICAL）。
# - 扫描报告与 SBOM(trivy CycloneDX) 在成功或失败时均上传为 artifact（if: always()）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 显式声明最小权限。原先整份文件没有一个 permissions 块 ⇒ 所有作业继承仓库/组织默认档，
# 而默认档很可能是"只读仓库内容"——那正好解释 build 作业的位置：`npm ci` 与 `npm run build`
# 都在诊断档镜像里证过 rc=0（PR #5 19:51:37 / 20:21:36 两条评论），失败落在其后唯一的
# upload-artifact 上（该动作要 `actions: write`）。同仓的 quality-diag.yml 声明了
# pull-requests: write 才贴得出评论，这本身就是"默认档不够用"的旁证。
permissions:
  contents: read # checkout
  actions: write # upload-artifact（dist / SBOM / 扫描报告 / playwright 产物）与其日志读取
  pull-requests: write # 失败时把现场贴回 PR 的那一步

jobs:
  quality:
    name: Lint + TypeCheck + Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Verify every tracked source is actually type-checked
        # 2026-09-27：ActionWorkbench.test.tsx 与 actionWorkbench.test.ts 去扩展名后大小写相等，
        # TS 在大小写不敏感卷的 include 展开会丢掉后者之一 ⇒ 那个组件测试文件从未被类型检查，
        # 而 tsc --noEmit 依旧 rc=0、vitest 也照常跑它。这条按"两边集合的差"来判，不看命名规律。
        run: |
          npm run tsc:cov:check
          node scripts/check-tsc-coverage.mjs --self-test
      - name: Frontend unit tests with coverage gate (>=30%)
        run: npx vitest run --coverage
      - run: npm run i18n:check
      - run: node scripts/check-i18n.mjs --self-test
      - name: Aggregate gate — every check-*.mjs must pass body AND --self-test
        # 今天缺的就是这一步：八把尺子各自有自测，但没人一次跑全，
        # 所以我能连着两次提交而漏掉 storage-receipt 的棘轮超限（quiet 74→79）。
        # 它不判断业务规则，只保证"没有哪把尺子被静默跳过"；清单靠枚举，不靠手写名单。
        run: npm run gates
      - name: Verify local-storage writes don't announce success without a receipt
        # R50：storage.ts 的 saveJSON/removeKey/clearAll 过去把 QuotaExceededError/SecurityError
        # 就地吞掉并返回 void ⇒ 调用方没有任何凭据，却能弹"已保存/已清空/已删除"。
        # 判据按函数粒度走 AST：丢弃回执 + 同函数后跟 notifySuccess + 无其他凭据（await / .success 读）⇒ 红。
        # 自测臂：注入 3 处必须开火、删掉成功提示必须降到 quiet（证明它不把"丢弃结果"本身当违规）。
        run: |
          npm run storage:check
          node scripts/check-storage-receipt.mjs --self-test
      - name: Verify settings fields are either read somewhere or declared inert
        # R56（R49 续）：设置页的字段有两根轴——值有没有上行到服务端、有没有任何生产代码读它。
        # 既不上行也没读者的开关，"设置已保存"是对用户宣称了一个不改变任何行为的动作。
        # 判据按类型解析（不用文本：同名的 Inquiry.currency 会污染分母），inert 必须逐条挂理由，
        # 且台账双向对账：谎报惰性 / 引用过期 / 单位被删 都判红。退码 2 = 量具故障，不与产品违规混。
        run: |
          npm run settings:inert:check
          node scripts/check-settings-inert.mjs --self-test
      - name: Verify past-tense notifications aren't minted inside an optimistic state recipe
        # R53：8 个写入口把「询价单 X 已取消」这类过去式通知铸在 set(状态配方) 体内，
        # 而 catch 只回滚实体、仓里没有删通知的 API ⇒ 被拒的动作留下永久旁证。
        # 自测三臂：夹具 2 处必须开火、合规侧 2 处不掉档、换成"4 次铸造全在配方之外"的逆语料必须 0 处。
        run: |
          npm run notify-mint:check
          node scripts/check-notification-optimistic-mint.mjs --self-test
      - name: Upload frontend test logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with:
          name: frontend-test-logs
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  build:
    name: Production Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with:
          name: dist
          path: dist/
      - name: 失败时把现场贴回 PR（本作业的日志要鉴权才读得到）
        # 为什么要这一步：build 作业连续两次在同一处红（19:08:26→19:09:23、19:45:30→19:46:27，都是 57 s），
        # 而同一台 runner、同一棵树上诊断档镜像跑的 `npm run build` 是 rc=0（PR #5 19:51:37 那条评论），
        # 本机 Linux/Node24/lab 装树复算 `tsc -b --force` 与 `vite build` 也全 rc=0。
        # 剩下的唯一未取证步骤是 upload-artifact，但 Actions 日志要登录才读得到、MCP 也没有取日志的工具，
        # 所以让**这一步自己把话带回来**：清点 dist、看磁盘、把 build 原样重跑一遍并如实报退码。
        # 重跑若 rc=0，就把"失败不在 build、而在 build 之后那一步"这条推断变成读数；仍非零则带回结尾 40 行。
        # 只在 failure() 时跑，不参与判定；事件字段一律走 env，不拼进 shell（见 PostToolUse 那条提示）。
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
          JOB_NAME: ${{ github.job }}
        run: |
          set +e
          {
            echo "### build 作业失败现场（一手取证，只回话不改判）"
            echo "- job=$JOB_NAME run=$RUN_ID head_ref=${HEAD_REF:-（push 事件无此值）}"
            echo "- node=$(node -v 2>/dev/null) npm=$(npm -v 2>/dev/null)"
            echo "- dist：$([ -d dist ] && echo 存在 || echo 不存在)｜文件数 $(find dist -type f 2>/dev/null | wc -l)｜体积 $(du -sh dist 2>/dev/null | cut -f1)"
            echo "- 磁盘：$(df -h "$PWD" | tail -1)"
            echo "- 重跑 \`npm run build\` 的结尾 40 行："
            echo '```'
            npm run build > /tmp/buildagain.log 2>&1
            rcagain=$?
            tail -40 /tmp/buildagain.log
            echo "重跑 rc=$rcagain"
            echo '```'
            echo "- 判读：重跑 rc=0 ⇒ 失败不在 npm ci/build，落在它之后那一步；rc≠0 ⇒ 结尾 40 行就是原因。"
            echo "- 本 job 自己的日志结尾 45 行（upload-artifact 之类的动作报错只会出现在这里）："
            echo '```'
            # 本 job 的 id 不能拿 github.job（那是键名 "build"）去配显示名——同一 run 里
            # "Docker Build + Compose…" 也含 "build"，会配错。改用一个自指事实：
            # 报告步跑在本 job 内部的那一刻，整个 run 里唯一 in_progress 且无 conclusion 的就是本 job。
            JID=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.status=="in_progress" and .conclusion==null) | .id' 2>/dev/null | head -1)
            echo "job_id=$JID（按 in_progress 自指挑出，不按名字匹配）"
            if [ -n "$JID" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$JID/logs" 2>&1 | tail -45
            else
              echo "取不到本 job 的 id（多半是令牌没有 actions: read）——那本身就是结论的一半"
            fi
            echo '```'
          } > /tmp/buildfail.md
          PR=""
          if [ -n "$HEAD_REF" ]; then
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json number --jq '.[0].number' 2>/dev/null)
          fi
          case "$PR" in
            ''|*[!0-9]*) echo "PR 编号取不到（=$PR），把现场打进日志"; cat /tmp/buildfail.md ;;
            *) gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/buildfail.md || cat /tmp/buildfail.md ;;
          esac
          exit 0

  backend-test:
    name: Backend Lint + Unit + API Integration + Permissions + State Transitions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0 (node24)
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Backend import smoke test
        run: cd backend && python -c "from app.main import app; print('Backend import OK')"
      - name: Verify Alembic migration (SQLite)
        run: cd backend && DB_PATH=ci_migration.db python -m alembic upgrade head && rm -f ci_migration.db
      - name: Run backend tests (pytest, SQLite, coverage >=80%)
        run: cd backend && python -m pytest -v
      - name: Run PostgreSQL integration tests (real PG)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # 修复 pytest-cov 禁用冲突：pytest.ini 的 addopts 会注入 --cov=app，
        # 若仅用 -p no:cov 禁用插件，--cov 参数将变成无法识别的参数导致 pytest 报错退出。
        # -p no:cov 禁用插件，-o addopts= 清空 addopts 彻底移除 --cov 注入，二者结合才真正关闭覆盖率。
        run: cd backend && python -m pytest tests/test_postgres_integration.py -v -p no:cov -o addopts=
      - name: Upload backend test logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with:
          name: backend-test-logs
          path: backend/.pytest_cache/
          if-no-files-found: ignore

  security-scan:
    name: Security Scan (Secrets + SAST + Dependencies + Image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
        with:
          # gitleaks 需要全量历史计算 PR/push 的 diff 范围（base^..head）；
          # 默认浅克隆（depth=1）会导致 base 提交不可用，gitleaks 报
          # "unknown revision / failed to scan Git repository" 而退出码 1。
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0 (node24)
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (node24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Python SAST (bandit)
        run: |
          cd backend && pip install bandit
          bandit -r app -f html -o bandit.html
          bandit -r app -f json -o bandit.json
      - name: Python dependency audit (pip-audit, scoped to declared runtime deps)
        run: |
          cd backend && pip install pip-audit
          # 仅审计 requirements.txt 声明的运行时依赖，而非整个 Python 环境。
          # 环境中的 pip 自身可能存在开发期 CVE（与生产运行时无关），纳入会使安全门禁误报失败。
          pip-audit -r requirements.txt --format json > pip-audit.json
      - name: Node dependency audit (npm audit, minimal-scope exception)
        run: node scripts/audit-exceptions.mjs
      - name: Image scan (Trivy)
        run: |
          # 后端 Dockerfile 从上下文根复制 requirements.txt，构建上下文必须是 backend/（与
          # docker-compose 的 build: ./backend 一致）；此前用仓库根 "." 作上下文导致
          # COPY requirements.txt 找不到文件、构建失败（非真实漏洞）。
          docker build -t procurement-backend -f backend/Dockerfile backend
          docker build -t procurement-frontend . -f Dockerfile.frontend
          # 先输出一份 TABLE 摘要到 stdout（不带 --exit-code：有漏洞也退出 0），
          # 便于在 Actions 日志里直接看到命中的 HIGH/CRITICAL CVE 与 Pkg/Installed 版本，
          # 而不是只有 JSON 报表（JSON 需下载 artifact 才能排查）。
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --no-progress --severity HIGH,CRITICAL --format table procurement-backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --no-progress --severity HIGH,CRITICAL --format table procurement-frontend
          # 通过 -v "$PWD:/report" 把当前目录挂载进容器，使 trivy 的 -o 报表写到宿主机
          # （否则 -o 只写进刚退出的容器内，宿主拿不到报表，失败时无法排查）。
          # --exit-code 1 作为强门禁：命中 HIGH/CRITICAL 即非零退出，阻断 CI。
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/report" -w /report aquasec/trivy:0.57.1 image --exit-code 1 --no-progress --severity HIGH,CRITICAL --format json -o trivy-backend.json procurement-backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/report" -w /report aquasec/trivy:0.57.1 image --exit-code 1 --no-progress --severity HIGH,CRITICAL --format json -o trivy-frontend.json procurement-frontend
      - name: Generate SBOM (CycloneDX via trivy, backend + frontend)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.57.1 fs --quiet --format cyclonedx --output sbom-backend.cdx.json backend
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.57.1 fs --quiet --format cyclonedx --output sbom-frontend.cdx.json .
          cd backend && pip freeze > ../sbom-backend-requirements.txt
          cp ../package-lock.json ../sbom-frontend-package-lock.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with:
          name: sbom
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
            sbom-backend-requirements.txt
            sbom-frontend-package-lock.json
          if-no-files-found: ignore
      - name: Upload scan reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with:
          name: security-scan-reports
          path: |
            backend/bandit.html
            backend/bandit.json
            pip-audit.json
            npm-audit.json
            trivy-backend.json
            trivy-frontend.json
          if-no-files-found: ignore

  docker-e2e:
    name: Docker Build + Compose + Real Frontend/Backend E2E
    needs: [quality, build, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies (incl. @playwright/test)
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser binaries (chromium + firefox + webkit)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cache ClamAV signature database
        # 避免每次运行全量下载 ClamAV 病毒库（实测冷启动约 20 分钟）。
        # 缓存命中后 clamav 容器启动即用已有库，freshclam 仅做增量检查，就绪时间缩至秒级。
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (node24)
        with:
          path: .clamav-cache
          key: clamav-db-${{ runner.os }}
          restore-keys: |
            clamav-db-${{ runner.os }}
      - name: Verify E2E config contract (demo password consistency)
        # 本 job 给 compose 与 playwright 两步各写了一次 DEMO_USER_PASSWORD 格式串；
        # dev 形态则靠 compose 默认值与 e2e/helpers.ts 兜底值对齐。任一漂移会让整套 E2E
        # 先 401×5 再全线 429，读起来像限流故障。这里在启动 compose 之前先判红，
        # 并跑尺子自带的两条反证（注入漂移 / 删除位点必须翻红）。
        run: |
          npm run e2e:config:check
          node scripts/check-e2e-demo-password.mjs --self-test
      - name: Verify installed tree matches the lockfile (drift pre-flight)
        # 2026-09-27 事故：一次 `npm install --no-save` 在跑测中的同一棵树上把 79 个包按 `^` 区间
        # 就地升级（含 @playwright/test 1.62.1→1.63.0），runner 被中途换掉，最后起跑的那个 project
        # 39 条全灭于 "Executable doesn't exist"，先跑完的 4 个 project 照旧绿 —— 读起来像产品回归。
        # git status 看不见这个面（node_modules 未跟踪），所以要一把独立的尺子。
        # 本机另有 Playwright 的 globalSetup 兜住 `npx playwright test` 这条路；CI 这条是显式第二步，
        # 保证即使有人绕过 config 也拦得住。跑尺子自身的 7 条反证（含"必须不开火"的平台可选包臂）。
        run: |
          npm run e2e:install:check
          node scripts/check-e2e-install.mjs --self-test
      - name: Verify E2E write-proof criterion (toast assertions)
        # R34：不指名的成功提示断言会被上一条还在屏上的 toast 冒充，于是用例在写请求
        # 飞行中就 goto、把请求掐断，表现为偶发红。这里钉住「证明写落地的提示必须指名文案」。
        # 判据已按 AST 版实现（认得模板字符串选择器、变量间接、getByText 的实参歧义；
        # 缺席断言与按钮名单列一档不误伤）。自测条数由脚本自己打印，不在这里抄数字。
        run: |
          npm run e2e:toast:check
          node scripts/check-e2e-toast-assertions.mjs --self-test
      - name: Build & start all services (docker compose)
        # 生产配置在 APP_ENV=prod 下为 fail-fast：compose 的 dev 默认值（SECRET_KEY/
        # DEMO_USER_PASSWORD/CORS/NOTIFY_CHANNEL）会被后端启动守卫拒绝。CI E2E 必须注入
        # 满足生产校验的真实值：强随机 SECRET_KEY、强 DEMO_USER_PASSWORD、非本地 CORS
        # 白名单、email 通知（SMTP 指向 mailpit 测试服务）。ClamAV 走真实扫描。
        env:
          SECRET_KEY: ${{ format('ci-e2e-{0}{1}{2}{3}', github.run_id, github.run_attempt, github.sha, 'strongsecretkey0123456789') }}
          DEMO_USER_PASSWORD: ${{ format('ci-e2e-{0}-strong-password', github.run_id) }}
          CORS_ORIGINS: https://ci-e2e.invalid,http://localhost:80
          NOTIFY_CHANNEL: email
          SMTP_HOST: mailpit
          SMTP_PORT: 1025
          SMTP_FROM: ci@ai-quotation.local
          # 生产形态 E2E 需要种子账号，但 APP_DEMO_MODE 会开启"快捷登录"且被生产配置校验
          # 拒绝。SEED_DEMO_DATA 与快捷登录解耦：只注入用 DEMO_USER_PASSWORD 哈希的种子
          # 用户（真实密码校验），在 APP_ENV=prod 下仍满足全部生产守卫（ClamAV/S3/Redis/
          # 强密码/非本地 CORS），使 E2E 能以内置账号真实登录。
          SEED_DEMO_DATA: true
        run: docker compose up -d --build
      - name: Wait for backend readiness (/api/ready validates DB+Redis+S3+ClamAV+Worker)
        run: |
          ok=0
          # ClamAV 首次启动需下载病毒库，冷启动实测约 20 分钟（命中 .clamav-cache 后秒级）；
          # 放宽就绪等待（最多 360*5s=1800s），并打印 /api/ready 响应体便于定位组件。
          for i in $(seq 1 360); do
            code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8080/api/ready || true)
            if [ "$code" = "200" ]; then ok=1; echo "Backend ready (attempt $i)"; break; fi
            echo "Waiting for /api/ready... (status=$code, attempt $i) body=$(cat /tmp/ready.json 2>/dev/null)"; sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Backend never became ready; last body: $(cat /tmp/ready.json 2>/dev/null)"
            docker compose ps
            docker compose logs --tail=200 backend
            # 诊断 ClamAV：确认 clamd 是否在 TCP 3310 监听、unix socket 是否存在，
            # 以及后端容器能否真实连上 clamav:3310（区分"连接失败"与"EICAR 未命中"两类根因）。
            echo "=== DIAG: clamad config ==="
            docker exec "$(docker compose ps -q clamav)" sh -c 'grep -E "TCPSocket|TCPAddr|LocalSocket" /etc/clamav/clamd.conf' 2>&1 || true
            echo "=== DIAG: clamd sockets ==="
            docker exec "$(docker compose ps -q clamav)" sh -c 'ls -la /tmp/clamd.sock /run/clamav/ 2>/dev/null; ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null' 2>&1 || true
            echo "=== DIAG: backend -> clamav:3310 TCP ==="
            docker exec "$(docker compose ps -q backend)" python -c "import socket; s=socket.create_connection(('clamav',3310),timeout=5); print('TCP_CONNECT_OK'); s.close()" 2>&1 || echo "TCP_CONNECT_FAIL"
            exit 1
          fi
          curl -sf http://localhost:8080/api/ready
      - name: Wait for frontend (nginx)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || true)
            if [ "$code" = "200" ]; then echo "Frontend ready (attempt $i)"; break; fi
            echo "Waiting for frontend... (status=$code, attempt $i)"; sleep 5
          done
          curl -sf http://localhost:80
      - name: Run Playwright E2E (real frontend/backend integration)
        timeout-minutes: 30
        env:
          # E2E 登录必须与后端种子用户密码一致（compose 已注入强 DEMO_USER_PASSWORD）。
          DEMO_USER_PASSWORD: ${{ format('ci-e2e-{0}-strong-password', github.run_id) }}
          # 抖动归因：默认档仍是 config 里的 1 次重试（main 上的读数与历史可比）。
          # 只有从 qoder/ci-evidence-0928 这条取证分支开出来的 PR 才关成 0——那条分支上
          # "渲染竞速断言"推广了 26 个站点，需要一次"首跑即绿"的读数才能归因；
          # 判 head_ref 而不是 ref_name，因为 pull_request 事件下 ref_name 是 refs/pull/N/merge。
          # 即便这条误合进 main，条件不命中也只是回到 1，不会把主线门禁改松或改严。
          PLAYWRIGHT_RETRIES: ${{ github.head_ref == 'qoder/ci-evidence-0928' && '0' || '1' }}
        run: npx playwright test --reporter=html,list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=300 || true
      - name: Cleanup environment
        if: always()
        run: docker compose down -v --remove-orphans
