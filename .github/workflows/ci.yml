name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + TypeCheck + Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Frontend unit tests with coverage gate (>=30%)
        run: npx vitest run --coverage
      - run: npm run i18n:check
      - name: Upload frontend test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-logs
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  build:
    name: Production Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  backend-test:
    name: Backend Lint + Unit + API Integration + Permissions + State Transitions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Backend import smoke test
        run: cd backend && python -c "from app.main import app; print('Backend import OK')"
      - name: Verify Alembic migration (SQLite)
        run: cd backend && DB_PATH=ci_migration.db python -m alembic upgrade head && rm -f ci_migration.db
      - name: Run backend tests (pytest, SQLite, coverage >=80%)
        run: cd backend && python -m pytest -v
      - name: Run PostgreSQL integration tests (real PG)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: cd backend && python -m pytest tests/test_postgres_integration.py -v -p no:cov
      - name: Upload backend test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: backend/.pytest_cache/
          if-no-files-found: ignore

  security-scan:
    name: Security Scan (Secrets + SAST + Dependencies + Image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Python SAST (bandit)
        run: |
          cd backend && pip install bandit
          bandit -r app -f html -o bandit.html || true
      - name: Python dependency audit (pip-audit)
        run: |
          cd backend && pip install pip-audit
          pip-audit || true
      - name: Node dependency audit (npm audit)
        run: npm audit --omit=dev || true
      - name: Image scan (Trivy)
        run: |
          docker build -t procurement-backend . -f backend/Dockerfile
          docker build -t procurement-frontend . -f Dockerfile.frontend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 0 --no-progress --severity HIGH,CRITICAL procurement-backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 0 --no-progress --severity HIGH,CRITICAL procurement-frontend
      - name: Upload scan reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            backend/bandit.html
            backend/bandit.json
          if-no-files-found: ignore

  docker-e2e:
    name: Docker Build + Compose + Real Frontend/Backend E2E
    needs: [quality, build, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Playwright browser binaries (chromium + firefox + webkit)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build & start all services (docker compose)
        run: docker compose up -d --build
      - name: Wait for backend health check (real DB probe)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then echo "Backend healthy (attempt $i)"; break; fi
            echo "Waiting for backend... (status=$code, attempt $i)"; sleep 5
          done
          curl -sf http://localhost:8080/api/health
      - name: Wait for frontend (nginx)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || true)
            if [ "$code" = "200" ]; then echo "Frontend ready (attempt $i)"; break; fi
            echo "Waiting for frontend... (status=$code, attempt $i)"; sleep 5
          done
          curl -sf http://localhost:80
      - name: Run Playwright E2E (real frontend/backend integration)
        timeout-minutes: 30
        run: npx playwright test --reporter=html,list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=300 || true
      - name: Cleanup environment
        if: always()
        run: docker compose down -v --remove-orphans